<title>mailecho</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' blob:; connect-src 'self';" />
<meta charset="UTF-8" />
<!-- @inject styles -->
<noscript>
    <style>
        #init, #flashbang {
            display: none !important;
        }
        #noscript {
            display: block !important;
        }
    </style>
</noscript>
<div id="noscript">
    Sorry, javascript is required here. We offer a number of alternatives to access your mail if you can't use javascript:
    <a href="https://en.wikipedia.org/wiki/Comparison_of_email_clients">Alternate Mail Login</a>
</div>
<div id="init">
    <h1>Loading...</h1>
    <div class="message"></div>
</div>

<!-- @inject templates -->

<div id=status>
<p></p> <label for=status-data-toggle class=hidden>[More Info]</label>
<input type=checkbox id=status-data-toggle class=hidden />
<span id=status_color></span>
<span id=notify_status title="All mailboxes are updated automatically">NOTIFY</span>
<span id=idle_status title="New mail is added automatically">IDLE</span>
<pre id=status-data></pre>
</div>

<div id=flashbang></div>
<!-- @inject application -->
