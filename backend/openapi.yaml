openapi: 3.1.0
info:
  title: mailecho API
  version: 1.0.0
  description: REST API for authenticated Migadu-backed mail operations.
  license: {name: Proprietary, identifier: Proprietary}
servers:
  - url: /
paths:
  /v1/session/login:
    post:
      summary: Sign in to a Migadu mailbox
      operationId: sessionLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '201':
          description: Session created; access and refresh cookies are set.
          content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}
        '4XX': {$ref: '#/components/responses/Problem'}
  /v1/session/refresh:
    post:
      summary: Rotate the refresh token
      operationId: sessionRefresh
      security: []
      responses:
        '200':
          description: Rotated session cookies.
          content:
            application/json:
              schema:
                type: object
                required: [object, refreshed]
                properties: {object: {const: session}, refreshed: {type: boolean}}
        '4XX': {$ref: '#/components/responses/Problem'}
  /v1/session/logout:
    post:
      summary: Revoke the current session
      operationId: sessionLogout
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                required: [object, logged_out]
                properties: {object: {const: session}, logged_out: {type: boolean}}
        '4XX': {$ref: '#/components/responses/Problem'}
  /v1/mailboxes:
    get:
      summary: List mailboxes
      operationId: listMailboxes
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Cursor-compatible mailbox list.
          content: {application/json: {schema: {$ref: '#/components/schemas/ListMailbox'}}}
        '4XX': {$ref: '#/components/responses/Problem'}
  /v1/mailboxes/{mailbox}/messages:
    get:
      summary: List message summaries
      operationId: listMessages
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Mailbox'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: after, in: query, schema: {type: string}}
        - {name: 'expand[]', in: query, style: form, explode: false, schema: {type: array, items: {type: string, enum: [mailbox, attachments, headers]}}}
      responses:
        '200':
          description: Cursor-paginated message summaries.
          content: {application/json: {schema: {$ref: '#/components/schemas/ListMessage'}}}
        '4XX': {$ref: '#/components/responses/Problem'}
  /v1/mailboxes/{mailbox}/messages/{uid}:
    get:
      summary: Retrieve a message
      operationId: getMessage
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Mailbox'}
        - {name: uid, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: 'expand[]', in: query, style: form, explode: false, schema: {type: array, items: {type: string, enum: [mailbox, attachments, headers]}}}
      responses:
        '200':
          description: Message resource; raw is base64 encoded.
          content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}
        '4XX': {$ref: '#/components/responses/Problem'}
  /v1/mailboxes/{mailbox}/messages/{uid}/flags:
    patch:
      summary: Replace message flags
      operationId: updateMessageFlags
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Mailbox'}
        - {name: uid, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flags]
              properties: {flags: {type: array, items: {type: string}}}
      responses:
        '200':
          description: Updated message flags.
          content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}
        '4XX': {$ref: '#/components/responses/Problem'}
  /v1/messages/send:
    post:
      summary: Send a message
      operationId: sendMessage
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 255}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients, raw]
              properties:
                from: {type: string, format: email}
                recipients: {type: array, minItems: 1, maxItems: 25, items: {type: string, format: email}}
                raw: {type: string, contentEncoding: base64}
      responses:
        '202':
          description: Message accepted.
          content:
            application/json:
              schema:
                type: object
                required: [object, sent]
                properties: {object: {const: message}, sent: {type: boolean}}
        '4XX': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Mailbox: {name: mailbox, in: path, required: true, schema: {type: string, maxLength: 255}}
  responses:
    Problem:
      description: RFC 9457 Problem Details.
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
        text/markdown: {schema: {type: string}}
        text/html: {schema: {type: string}}
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties: {username: {type: string, format: email}, password: {type: string, format: password}}
    Session:
      type: object
      required: [object, user, expires_at]
      properties:
        object: {const: session}
        user: {type: object, required: [object, id], properties: {object: {const: user}, id: {type: string}}}
        expires_at: {type: string, format: date-time}
    Mailbox:
      type: object
      required: [object, id, name, flags, delimiter]
      properties:
        object: {const: mailbox}
        id: {type: string}
        name: {type: string}
        flags: {type: array, items: {type: string}}
        delimiter: {type: string}
    MessageSummary:
      type: object
      required: [object, id, mailbox, uid, flags]
      properties:
        object: {const: message_summary}
        id: {type: string}
        mailbox: {type: string}
        uid: {type: integer}
        flags: {type: array, items: {type: string}}
        size: {type: integer}
    Message:
      type: object
      required: [object, id, mailbox, uid, flags]
      properties:
        object: {const: message}
        id: {type: string}
        mailbox:
          oneOf:
            - {type: string}
            - {$ref: '#/components/schemas/Mailbox'}
        uid: {type: integer}
        flags: {type: array, items: {type: string}}
        size: {type: integer}
        raw: {type: string, contentEncoding: base64}
        headers: {type: object}
        attachments: {type: array, items: {type: object}}
    ListMailbox:
      type: object
      required: [object, data, has_more, next_cursor, page, page_size]
      properties:
        object: {const: list}
        data: {type: array, items: {$ref: '#/components/schemas/Mailbox'}}
        has_more: {type: boolean}
        next_cursor: {type: [string, 'null']}
        page: {type: integer}
        page_size: {type: integer}
    ListMessage:
      type: object
      required: [object, data, has_more, next_cursor, page, page_size]
      properties:
        object: {const: list}
        data: {type: array, items: {$ref: '#/components/schemas/MessageSummary'}}
        has_more: {type: boolean}
        next_cursor: {type: [string, 'null']}
        page: {type: integer}
        page_size: {type: integer}
    Problem:
      type: object
      required: [type, title, status, detail, instance, object, code, request_id, retryable]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        object: {const: error}
        code: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        param: {type: string}
